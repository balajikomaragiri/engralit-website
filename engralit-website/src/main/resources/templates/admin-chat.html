<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin - Chat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

<nav class="navbar navbar-light bg-white shadow-sm py-3">
    <div class="container">
        <a class="navbar-brand fw-bold text-navy" href="/">ENGRALIT Admin</a>
        <div>
            <a href="/admin/enquiries" class="btn btn-outline-navy btn-sm me-2">Enquiries</a>
            <a href="/admin/chat" class="btn btn-outline-navy btn-sm">Chat</a>
        </div>
    </div>
</nav>

<div class="container py-4">
    <div class="row">
        <div class="col-md-4">
            <div class="list-group">
                <a th:each="s : ${students}" href="#" class="list-group-item list-group-item-action"
                   th:text="${s}" onclick="openChat(this.textContent); return false;"></a>
            </div>
        </div>
        <div class="col-md-8">
            <div id="chatMessages" class="bg-white rounded-3 shadow-sm p-3 mb-2" style="height:400px; overflow-y:auto;"></div>
            <div class="d-flex gap-2">
                <input type="text" id="replyInput" class="form-control" placeholder="Type a reply...">
                <button class="btn btn-navy" onclick="sendReply()">Send</button>
            </div>
        </div>
    </div>
</div>

<script>
    let currentStudent = null;

    function openChat(email) {
        currentStudent = email;
        fetch('/admin/chat/' + encodeURIComponent(email))
            .then(res => res.json())
            .then(messages => {
                const container = document.getElementById('chatMessages');
                container.innerHTML = '';
                messages.forEach(m => {
                    const div = document.createElement('div');
                    div.className = 'mb-2 d-flex ' + (m.sender === 'ADMIN' ? 'justify-content-end' : 'justify-content-start');
                    div.innerHTML = `<span class="px-2 py-1 rounded-3 small" style="background:${m.sender === 'ADMIN' ? '#1a2456;color:#fff' : '#e9ecef'}">${m.message}</span>`;
                    container.appendChild(div);
                });
                container.scrollTop = container.scrollHeight;
            });
    }

    function sendReply() {
        const input = document.getElementById('replyInput');
        if (!currentStudent || !input.value.trim()) return;
        fetch('/admin/chat/reply', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: currentStudent, message: input.value })
        }).then(() => {
            input.value = '';
            openChat(currentStudent);
        });
    }
</script>

</body>
</html>
