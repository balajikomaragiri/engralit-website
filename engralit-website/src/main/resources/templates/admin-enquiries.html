<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin - Enquiries</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

<nav class="navbar navbar-light bg-white shadow-sm py-3">
    <div class="container">
        <a class="navbar-brand fw-bold text-navy" href="/">ENGRALIT Admin</a>
        <div>
            <a href="/admin/enquiries" class="btn btn-outline-navy btn-sm me-2">Enquiries</a>
            <a href="/admin/chat" class="btn btn-outline-navy btn-sm">Chat</a>
        </div>
    </div>
</nav>

<div class="container py-4">
    <h4 class="fw-bold text-navy mb-3">Course Enquiries</h4>

    <form method="get" class="d-flex mb-3" style="max-width:400px;">
        <input type="text" name="search" th:value="${search}" class="form-control me-2" placeholder="Search name, email, phone">
        <button class="btn btn-navy">Search</button>
    </form>

    <div class="table-responsive bg-white rounded-3 shadow-sm">
        <table class="table table-hover mb-0 align-middle">
            <thead>
            <tr>
                <th>Name</th><th>Email</th><th>Phone</th><th>Course</th><th>Status</th><th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="e : ${enquiries}">
                <td th:text="${e.fullName}"></td>
                <td th:text="${e.email}"></td>
                <td th:text="${e.phone}"></td>
                <td th:text="${e.courseName}"></td>
                <td>
                    <span class="badge" th:classappend="${e.status == 'NEW'} ? 'bg-warning text-dark' : 'bg-success'"
                          th:text="${e.status}"></span>
                </td>
                <td class="d-flex gap-1">
                    <form th:action="@{'/admin/enquiries/' + ${e.id} + '/contacted'}" method="post">
                        <button class="btn btn-sm btn-outline-navy" th:disabled="${e.status == 'CONTACTED'}">Mark Contacted</button>
                    </form>
                    <form th:action="@{'/admin/enquiries/' + ${e.id} + '/delete'}" method="post"
                          onsubmit="return confirm('Delete this enquiry?');">
                        <button class="btn btn-sm btn-outline-danger">Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
