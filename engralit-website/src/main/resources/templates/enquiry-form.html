<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Course Enquiry - Engralit</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <!-- Enquiry Form Styling -->
    <style>

        body {
            background: linear-gradient(180deg, #eef1fb 0%, #f5f7fb 260px, #f5f7fb 100%);
        }

        /* ===== Top accent banner behind the card ===== */
        .enquiry-hero {
            background: linear-gradient(135deg, #17245c 0%, #101a44 100%);
            padding: 48px 0 90px;
            color: #fff;
            text-align: center;
        }

        .enquiry-hero .badge-course {
            background: rgba(244, 180, 26, 0.15);
            color: #f4b41a;
            border: 1px solid rgba(244, 180, 26, 0.4);
            font-weight: 600;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 0.85rem;
        }

        .enquiry-hero h1 {
            font-weight: 800;
            margin-top: 14px;
            margin-bottom: 8px;
        }

        .enquiry-hero p {
            color: rgba(255,255,255,0.75);
            max-width: 520px;
            margin: 0 auto;
        }

        /* Pull the card up over the hero for a layered look */
        .enquiry-wrap {
            margin-top: -60px;
        }

        /* Enquiry Card */
        .enquiry-card {
            background: white;
            border: none;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(23, 36, 92, 0.15);
            overflow: hidden;
        }

        .enquiry-card .card-body {
            padding: 2.75rem;
        }

        /* Section labels within the form */
        .section-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #17245c;
            font-weight: 700;
            font-size: 0.95rem;
            margin-bottom: 14px;
        }

        .section-tag i {
            color: #f4b41a;
        }

        hr.section-divider {
            border-top: 1px dashed #e3e6f0;
            margin: 28px 0 24px;
        }

        /* Form Labels */
        .form-label {
            color: #17245c;
            font-weight: 600;
            font-size: 0.92rem;
        }

        .form-label .req {
            color: #e6535a;
            margin-left: 2px;
        }

        .form-label .opt {
            color: #9aa0b4;
            font-weight: 500;
            font-size: 0.8rem;
        }

        /* Input groups with icons */
        .input-icon-group {
            position: relative;
        }

        .input-icon-group i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #9aa0b4;
            font-size: 0.95rem;
            pointer-events: none;
            transition: color 0.2s;
        }

        .input-icon-group .form-control,
        .input-icon-group .form-select {
            padding-left: 40px;
        }

        .input-icon-group .form-control:focus ~ i,
        .input-icon-group .form-select:focus ~ i {
            color: #f4b41a;
        }

        /* Input Fields */
        .form-control,
        .form-select {
            border-radius: 10px;
            padding: 11px 14px;
            border: 1.5px solid #e3e6f0;
            font-size: 0.95rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        /* Input Focus */
        .form-control:focus,
        .form-select:focus {
            border-color: #f4b41a;
            box-shadow: 0 0 0 0.2rem rgba(244, 180, 26, 0.18);
        }

        /* Valid state (filled + no error) */
        .form-control.is-touched-valid {
            border-color: #4caf7d;
        }

        textarea.form-control {
            resize: none;
        }

        .char-counter {
            font-size: 0.78rem;
            color: #9aa0b4;
            text-align: right;
            margin-top: 4px;
        }

        /* Submit Button */
        .btn-enquiry {
            background: linear-gradient(135deg, #f4b41a 0%, #e0a30f 100%);
            color: #17245c;
            border: none;
            font-weight: 700;
            border-radius: 10px;
            padding: 14px;
            font-size: 1.05rem;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            box-shadow: 0 8px 18px rgba(244, 180, 26, 0.35);
        }

        .btn-enquiry:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 22px rgba(244, 180, 26, 0.45);
            color: #17245c;
        }

        .btn-enquiry:active {
            transform: translateY(0);
        }

        .trust-row {
            display: flex;
            justify-content: center;
            gap: 22px;
            flex-wrap: wrap;
            margin-top: 18px;
            font-size: 0.82rem;
            color: #6b7186;
        }

        .trust-row span {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .trust-row i {
            color: #4caf7d;
        }

        @media (max-width: 576px) {
            .enquiry-card .card-body {
                padding: 1.75rem 1.25rem;
            }
        }

    </style>

</head>

<body>

<!-- ===== NAVBAR ===== -->
<nav class="navbar navbar-light bg-white shadow-sm py-3">

    <div class="container">

        <a class="navbar-brand fw-bold fs-4 text-navy d-flex align-items-center gap-2"
           href="/">

            <img th:src="@{/images/logo.png}"
                 alt="Engralit Logo"
                 height="40">

            ENGRALIT

        </a>

    </div>

</nav>

<!-- ===== HERO BANNER ===== -->
<div class="enquiry-hero">
    <div class="container">
        <span class="badge-course">
            <i class="bi bi-mortarboard-fill"></i>
            Course Enquiry
        </span>

        <h1 th:text="${course.title}">Course Title</h1>

        <p>
            Fill out the quick form below and our team will personally reach out to guide you through enrollment.
        </p>
    </div>
</div>

<!-- ===== COURSE ENQUIRY SECTION ===== -->
<section class="enquiry-wrap pb-5">

    <div class="container" style="max-width:700px;">

        <!-- Enquiry Card -->
        <div class="card enquiry-card">

            <div class="card-body">

                <!-- ===== ENQUIRY FORM ===== -->
                <form th:action="@{/enquiry}"
                      th:object="${enquiry}"
                      method="post"
                      id="enquiryForm"
                      novalidate>


                    <!-- Hidden Course Information -->

                    <input type="hidden"
                           th:field="*{courseId}">

                    <input type="hidden"
                           th:field="*{courseName}">


                    <!-- ===== SECTION: Personal Details ===== -->
                    <div class="section-tag">
                        <i class="bi bi-person-badge-fill"></i>
                        Your Details
                    </div>

                    <!-- Full Name -->

                    <div class="mb-3">

                        <label class="form-label">
                            Full Name <span class="req">*</span>
                        </label>

                        <div class="input-icon-group">
                            <input type="text"
                                   class="form-control"
                                   th:field="*{fullName}"
                                   placeholder="e.g. User Name"
                                   autocomplete="name"
                                   required>
                            <i class="bi bi-person"></i>
                        </div>

                        <div class="text-danger small"
                             th:if="${#fields.hasErrors('fullName')}"
                             th:errors="*{fullName}">
                        </div>

                    </div>


                    <!-- Email & Phone -->

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Email <span class="req">*</span>
                            </label>

                            <div class="input-icon-group">
                                <input type="email"
                                       class="form-control"
                                       th:field="*{email}"
                                       placeholder="you@example.com"
                                       autocomplete="email"
                                       required>
                                <i class="bi bi-envelope"></i>
                            </div>

                            <div class="text-danger small"
                                 th:if="${#fields.hasErrors('email')}"
                                 th:errors="*{email}">
                            </div>

                        </div>


                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Phone Number <span class="req">*</span>
                            </label>

                            <div class="input-icon-group">
                                <input type="tel"
                                       class="form-control"
                                       th:field="*{phone}"
                                       placeholder="10-digit number"
                                       inputmode="numeric"
                                       maxlength="10"
                                       pattern="[0-9]{10}"
                                       autocomplete="tel"
                                       required>
                                <i class="bi bi-telephone"></i>
                            </div>

                            <div class="text-danger small"
                                 th:if="${#fields.hasErrors('phone')}"
                                 th:errors="*{phone}">
                            </div>

                        </div>

                    </div>


                    <!-- WhatsApp Number -->

                    <div class="mb-2">

                        <label class="form-label">
                            WhatsApp Number
                            <span class="opt">(if different from phone)</span>
                        </label>

                        <div class="input-icon-group">
                            <input type="tel"
                                   class="form-control"
                                   th:field="*{whatsapp}"
                                   placeholder="Same as phone number"
                                   inputmode="numeric"
                                   maxlength="10">
                            <i class="bi bi-whatsapp"></i>
                        </div>

                        <div class="text-danger small"
                             th:if="${#fields.hasErrors('whatsapp')}"
                             th:errors="*{whatsapp}">
                        </div>

                    </div>


                    <hr class="section-divider">

                    <!-- ===== SECTION: Location & Background ===== -->
                    <div class="section-tag">
                        <i class="bi bi-geo-alt-fill"></i>
                        Location &amp; Background
                    </div>

                    <!-- State & City -->

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                State <span class="req">*</span>
                            </label>

                            <div class="input-icon-group">
                                <select class="form-select"
                                        th:field="*{state}"
                                        id="stateSelect"
                                        required>
                                    <option value="" disabled selected>Select your state</option>
                                </select>
                                <i class="bi bi-map"></i>
                            </div>

                            <div class="text-danger small"
                                 th:if="${#fields.hasErrors('state')}"
                                 th:errors="*{state}">
                            </div>

                        </div>


                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                City <span class="req">*</span>
                            </label>

                            <div class="input-icon-group">
                                <input type="text"
                                       class="form-control"
                                       th:field="*{city}"
                                       id="cityInput"
                                       list="cityOptions"
                                       placeholder="Select state first"
                                       autocomplete="address-level2"
                                       required>
                                <i class="bi bi-building"></i>
                            </div>

                            <datalist id="cityOptions"></datalist>

                            <div class="text-danger small"
                                 th:if="${#fields.hasErrors('city')}"
                                 th:errors="*{city}">
                            </div>

                        </div>

                    </div>


                    <!-- Qualification -->

                    <div class="mb-4">

                        <label class="form-label">
                            Qualification <span class="req">*</span>
                        </label>

                        <div class="input-icon-group">
                            <input type="text"
                                   class="form-control"
                                   th:field="*{qualification}"
                                   list="qualificationOptions"
                                   placeholder="e.g. M.A. English"
                                   required>
                            <i class="bi bi-mortarboard"></i>
                        </div>

                        <datalist id="qualificationOptions">
                            <option value="B.A. English">
                            <option value="M.A. English">
                            <option value="B.Ed">
                            <option value="M.Ed">
                            <option value="Ph.D">
                            <option value="B.A. (Other)">
                            <option value="M.A. (Other)">
                        </datalist>

                        <div class="text-danger small"
                             th:if="${#fields.hasErrors('qualification')}"
                             th:errors="*{qualification}">
                        </div>

                    </div>


                    <hr class="section-divider">

                    <!-- ===== SECTION: Message ===== -->
                    <div class="section-tag">
                        <i class="bi bi-chat-left-text-fill"></i>
                        Anything Else?
                    </div>

                    <!-- Message -->

                    <div class="mb-4">

                        <label class="form-label">
                            Message
                            <span class="opt">(optional — tell us your goals, doubts, or preferred batch timing)</span>
                        </label>

                        <textarea class="form-control"
                                  rows="3"
                                  maxlength="500"
                                  id="messageInput"
                                  th:field="*{message}">
                        </textarea>

                        <div class="char-counter">
                            <span id="charCount">0</span>/500
                        </div>

                    </div>


                    <!-- Submit Button -->

                    <button type="submit"
                            class="btn btn-enquiry w-100"
                            id="submitBtn">

                        <span id="submitLabel">Submit Enquiry</span>
                        <i class="bi bi-arrow-right ms-1"></i>

                    </button>

                    <div class="trust-row">
                        <span><i class="bi bi-shield-check"></i> Your details are safe</span>
                        <span><i class="bi bi-clock-history"></i> We reply within 24 hrs</span>
                        <span><i class="bi bi-x-circle"></i> No spam, ever</span>
                    </div>


                </form>

            </div>

        </div>

    </div>

</section>

<script>
    // ===== State -> City data (India, expand as needed) =====
    const stateCityData = {
        "Andhra Pradesh": ["Vijayawada", "Visakhapatnam", "Guntur", "Nellore", "Tirupati", "Kurnool", "Kadapa"],
        "Telangana": ["Hyderabad", "Warangal", "Nizamabad", "Karimnagar", "Khammam"],
        "Tamil Nadu": ["Chennai", "Coimbatore", "Madurai", "Tiruchirappalli", "Salem"],
        "Karnataka": ["Bengaluru", "Mysuru", "Hubballi", "Mangaluru", "Belagavi"],
        "Kerala": ["Thiruvananthapuram", "Kochi", "Kozhikode", "Thrissur", "Kollam"],
        "Maharashtra": ["Mumbai", "Pune", "Nagpur", "Nashik", "Aurangabad"],
        "Delhi": ["New Delhi", "Dwarka", "Rohini", "Saket", "Karol Bagh"],
        "Uttar Pradesh": ["Lucknow", "Kanpur", "Varanasi", "Agra", "Noida"],
        "West Bengal": ["Kolkata", "Howrah", "Durgapur", "Siliguri", "Asansol"],
        "Rajasthan": ["Jaipur", "Jodhpur", "Udaipur", "Kota", "Ajmer"],
        "Gujarat": ["Ahmedabad", "Surat", "Vadodara", "Rajkot", "Gandhinagar"],
        "Bihar": ["Patna", "Gaya", "Bhagalpur", "Muzaffarpur"],
        "Odisha": ["Bhubaneswar", "Cuttack", "Rourkela", "Berhampur"],
        "Punjab": ["Chandigarh", "Ludhiana", "Amritsar", "Jalandhar"],
        "Madhya Pradesh": ["Bhopal", "Indore", "Gwalior", "Jabalpur"],
        "Other": []
    };

    document.addEventListener('DOMContentLoaded', function () {
        const stateSelect = document.getElementById('stateSelect');
        const cityInput = document.getElementById('cityInput');
        const cityOptions = document.getElementById('cityOptions');
        const existingCity = cityInput.value; // pre-filled value from Thymeleaf (validation re-render)
        const existingState = stateSelect.getAttribute('data-selected') || '';

        // Populate state dropdown
        Object.keys(stateCityData).forEach(function (state) {
            const opt = document.createElement('option');
            opt.value = state;
            opt.textContent = state;
            stateSelect.appendChild(opt);
        });

        // Re-select state if the form re-rendered with a value (validation error case)
        const thymeleafStateValue = stateSelect.getAttribute('th-preselect');
        if (thymeleafStateValue && stateCityData[thymeleafStateValue]) {
            stateSelect.value = thymeleafStateValue;
            populateCities(thymeleafStateValue);
            if (existingCity) cityInput.value = existingCity;
        }

        stateSelect.addEventListener('change', function () {
            populateCities(this.value);
            cityInput.value = '';
            cityInput.placeholder = 'Type or select your city';
        });

        function populateCities(state) {
            cityOptions.innerHTML = '';
            const cities = stateCityData[state] || [];
            cities.forEach(function (city) {
                const opt = document.createElement('option');
                opt.value = city;
                cityOptions.appendChild(opt);
            });
        }

        // ===== Character counter for message =====
        const messageInput = document.getElementById('messageInput');
        const charCount = document.getElementById('charCount');
        function updateCharCount() {
            charCount.textContent = messageInput.value.length;
        }
        messageInput.addEventListener('input', updateCharCount);
        updateCharCount();

        // ===== Live valid-state highlighting =====
        const controls = document.querySelectorAll('.form-control[required], .form-select[required]');
        controls.forEach(function (el) {
            el.addEventListener('blur', function () {
                if (el.value.trim() !== '' && el.checkValidity()) {
                    el.classList.add('is-touched-valid');
                } else {
                    el.classList.remove('is-touched-valid');
                }
            });
        });

        // ===== Submit button loading state =====
        const form = document.getElementById('enquiryForm');
        const submitBtn = document.getElementById('submitBtn');
        const submitLabel = document.getElementById('submitLabel');
        form.addEventListener('submit', function () {
            if (form.checkValidity()) {
                submitBtn.disabled = true;
                submitLabel.textContent = 'Submitting...';
            }
        });
    });
</script>

</body>
</html>
