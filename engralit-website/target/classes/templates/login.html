<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Engralit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

<div class="container d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="card shadow-sm p-4" style="max-width: 400px; width: 100%;">
        <div class="text-center mb-4">
            <img th:src="@{/images/logo.png}" alt="Engralit Logo" height="58">
            <h4 class="text-navy fw-bold mt-2">Login to Engralit</h4>
        </div>

        <div th:if="${param.error}" class="alert alert-danger">Invalid email or password.</div>
        <div th:if="${param.registered}" class="alert alert-success">Account created! Please login.</div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-navy w-100">Login</button>
        </form>
        <div class="text-center my-3 text-muted">— OR —</div>

        <a href="/oauth2/authorization/google" class="btn btn-outline-dark w-100 d-flex align-items-center justify-content-center gap-2">
            <img src="https://www.svgrepo.com/show/475656/google-color.svg" width="20" height="20" alt="Google">
            Continue with Google
        </a>

        <p class="text-center mt-3 mb-0">
            Don't have an account? <a th:href="@{/signup}">Sign up</a>
        </p>
    </div>
</div>

</body>
</html>
