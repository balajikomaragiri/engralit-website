spring.application.name=engralit-website

# ---- MySQL Database Config ----
# Create a database first: CREATE DATABASE engralit_db;
spring.datasource.url=jdbc:mysql://localhost:3306/engralit_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=balaji@12
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
# update = keeps your data, only alters tables. Good for dev.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ---- Seed data (only runs once tables exist, safe to leave on for now) ----
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

server.port=8081
